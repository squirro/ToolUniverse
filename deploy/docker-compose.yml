services:
  # Skill Runs (ADR-0016). The dev-server is one binary with an SQLite file:
  # --db-filename puts it on a volume, because the default is in-memory and the
  # point of a Run Record is that it survives a restart. The volume mounts on
  # /home/temporal, which the image owns: Docker copies that ownership onto a
  # fresh volume, whereas a path the image lacks comes up root-owned and SQLite
  # reports "unable to open database file: out of memory (14)". Namespace
  # `skills` is created at start; temporal-init raises its retention from the
  # 24h default. Nothing host-specific: official image, standard ports, same on AWS.
  temporal:
    image: temporalio/temporal:1.8.3
    container_name: temporal
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
      - --namespace
      - skills
    ports:
      # Loopback only — reach both over the SSH tunnel like GraphDB. 7233 is gRPC
      # for a host-side client (deploy/skill_run.py); 8233 is the web UI.
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal_data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  # One-shot: 30 days is Temporal's usual ceiling. The permanent Run Record is
  # the next rung (PROV-O in GraphDB); this keeps a demoed run reviewable meanwhile.
  temporal-init:
    image: temporalio/temporal:1.8.3
    container_name: temporal-init
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    command:
      - operator
      - namespace
      - update
      - --address
      - temporal:7233
      - --retention
      - 720h
      - -n
      - skills

  smcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: smcp:local
    container_name: smcp
    restart: unless-stopped
    ports:
      # Bind to host loopback only — sqgenaid on the same host reaches
      # the server via 127.0.0.1:8765. No external exposure.
      # Host port 8765 (not 8000) because sqgenaid itself runs uvicorn
      # on 127.0.0.1:8000 on sempart-demo.
      - "127.0.0.1:8765:8000"
    env_file: .env
    depends_on:
      temporal:
        condition: service_started   # the worker retries until Temporal answers
    volumes:
      # TU workspace: HPA bulk TSVs, NCBI cache, downloaded reference
      # data. Survives container recreate. Mounted at the non-root app
      # user's HOME (uid 10001) — the named volume inherits the image dir's
      # 10001 ownership on first mount, so the non-root process can write it.
      - smcp_workspace:/home/app/.tooluniverse
    healthcheck:
      # TCP port check via stdlib — robust against MCP protocol changes.
      test:
        - CMD
        - python3.11
        - -c
        - "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000)); sys.exit(0)"
      interval: 30s
      timeout: 5s
      retries: 3
      # Compact mode loads all ~2,278 tools in background — slower cold start
      # than the previous category-curated build (~23 tools). Bumped from 90s.
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  smcp_workspace:
  temporal_data:
