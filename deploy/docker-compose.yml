services:
  smcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: smcp:local
    container_name: smcp
    restart: unless-stopped
    ports:
      # Bind to host loopback only — sqgenaid on the same host reaches
      # the server via 127.0.0.1:8765. No external exposure.
      # Host port 8765 (not 8000) because sqgenaid itself runs uvicorn
      # on 127.0.0.1:8000 on sempart-demo.
      - "127.0.0.1:8765:8000"
    env_file: .env
    # Persist large caches that would otherwise vanish on container
    # recreate:
    #   /root/.tooluniverse           → TU workspace (HPA TSV, NCBI, etc.)
    #   /root/.cache/huggingface      → HF model downloads (5–10 GB —
    #                                   mims-harvard/ToolRAG-T1-GTE-Qwen2-1.5B
    #                                   alone is ~3 GB)
    #   /root/.cache/tooluniverse     → Tool_RAG .pt embeddings cache
    environment:
      # Steer TU's own user_cache_dir into the volume too so .pt
      # embeddings persist across container recreate.
      TOOLUNIVERSE_TMPDIR: /root/.tooluniverse/cache
    volumes:
      - smcp_workspace:/root/.tooluniverse
      - smcp_hf_cache:/root/.cache/huggingface
    healthcheck:
      # TCP port check via stdlib — robust against MCP protocol changes.
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000)); sys.exit(0)"
      interval: 30s
      timeout: 5s
      retries: 3
      # Full TU load + initial search-index build is slow on cold start.
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  smcp_workspace:
  smcp_hf_cache:
