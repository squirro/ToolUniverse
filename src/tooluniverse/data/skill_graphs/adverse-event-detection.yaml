# adverse-event-detection as a process graph.
#
# The nine phases of the prose body, with the plan moved out of the model's head.
# Each step names its calls, what to extract and what must run before it. The
# body's "do not skip" gateways are `when:` conditions here.
#
# Facts the agent feeds back: requested_meddra, and the comparator it picks from the drug's class.

skill: adverse-event-detection
inputs: [drug_name]
# Optional, bound by the agent from the question in its own words. The words are
# read onto FAERS terms by the `requested_terms` step, never sent to FAERS as they stand.
optional_inputs: [requested_aes]

# What the agent gets whole. A table a later step reads must be a fact.
tables:
  faers_term_rows: fact     # the source's vocabulary for this drug; the reading is checked against it
  requested_meddra: fact    # the reading itself: shown in the report, row by row
  prr_rows: fact            # the grading reads it
  graded_rows: fact         # the signal table the report cites from

steps:
  - id: resolve_drug
    label: "Phase 0 — resolve the drug to a ChEMBL ID"
    calls:
      - tool: OpenTargets_get_drug_chembId_by_generic_name
        arguments: {drugName: "{drug_name}"}
    # The first hit is the drug; salts and neighbours follow.
    extract: {chembl_id: "data.search.hits.0.id"}
    produces: [chembl_id]
    notes: >-
      The ChEMBL ID is carried into every later step. If nothing resolves, the subject
      is probably not a drug — say so rather than reading the rest as a drug's profile.

  - id: indications
    label: "Phase 0 — approved indications and clinical stage"
    requires: [resolve_drug]
    calls:
      - tool: OpenTargets_get_drug_indications_by_chemblId
        arguments: {chemblId: "{chembl_id}"}

  - id: reaction_terms
    label: "Phase 1 — the reactions FAERS coded for this drug (breadth)"
    requires: [resolve_drug]
    calls:
      - tool: FAERS_count_reactions_by_drug_event
        arguments: {medicinalproduct: "{drug_name}"}
    collect:
      # The source's own vocabulary for this drug, whole: what a requested word is read onto and checked against.
      faers_term_rows: {path: "result", flatten: true, fields: ["term", "count"]}
    extract:
      # Coding noise and outcomes, not reactions. Excluded before the cap; `excluded` says so.
      top_aes:
        path: "result[].term"
        limit: 20
        exclude: [ILL-DEFINED DISORDER, GENERAL PHYSICAL HEALTH DETERIORATION, ILLNESS,
                  LABORATORY TEST ABNORMAL, DISEASE PROGRESSION, MALIGNANT NEOPLASM PROGRESSION,
                  DEATH, CONDITION AGGRAVATED, OFF LABEL USE, DRUG INEFFECTIVE,
                  PRODUCT USE ISSUE, NO ADVERSE EVENT]
    produces: [faers_term_rows, top_aes]
    notes: >-
      These counts use MedDRA Lowest Level Terms; the disproportionality step uses
      Preferred Terms, so the numbers will differ. The terms are carried forward
      exactly as returned.

  - id: requested_terms
    label: "Phase 1b — the question's words, read onto the source's terms"
    requires: [reaction_terms]
    when: requested_aes
    calls: []
    # The reading is the agent's judgement, shown and not trusted: checked against
    # `faers_term_rows` for membership, then placed by an ontology as evidence of meaning.
    judge: [requested_meddra]
    mapping:
      requested_meddra: {of: requested_aes, onto: {rows: faers_term_rows, field: term}}
    produces: [requested_meddra]
    notes: >-
      Answer `requested_meddra` as a list of rows, one per FAERS term you read a
      requested word onto: {of: the word as the question gave it, term: the FAERS
      term copied exactly from the list in `choices.requested_meddra` (the source's
      own terms for this drug, whole), reason: one sentence saying why this term is
      that word, concept: a list of two to four plain words that name the organ,
      system or injury the word means, for an ontology to place the term under}.
      Read the whole list before you answer; the terms you want are often far down
      it. A word may map onto several terms and a term may serve several words.
      Leave a word out only when no listed term is that injury, and say so in the
      report.

  - id: signal_terms
    label: "Phase 1c — the reactions the disproportionality loop runs over"
    requires: [reaction_terms, requested_terms]
    calls: []
    combine:
      # The mapped terms lead; the cap trims the frequency-ranked tail, never the ask.
      signal_aes: {union: [requested_meddra_terms, top_aes], limit: 20}
    produces: [signal_aes]

  - id: ae_profile
    label: "Phase 1d — how seriously the events were reported"
    requires: [resolve_drug]
    calls:
      - tool: FAERS_count_seriousness_by_drug_event
        arguments: {medicinalproduct: "{drug_name}"}
      - tool: FAERS_count_outcomes_by_drug_event
        arguments: {medicinalproduct: "{drug_name}"}
      - tool: FAERS_count_death_related_by_drug
        arguments: {medicinalproduct: "{drug_name}"}
    notes: Seriousness, outcomes and deaths as reported; disproportionality is the primary metric.

  - id: disproportionality
    label: "Phase 2 — disproportionality per reaction (PRIMARY SIGNAL METRIC)"
    requires: [signal_terms]
    for_each: signal_aes
    as: adverse_event
    calls:
      - tool: FAERS_calculate_disproportionality
        arguments: {drug_name: "{drug_name}", adverse_event: "{adverse_event}"}
    collect:
      # One row per reaction: term, value and the link of its own query together.
      prr_rows: {path: "", fields: ["$item as term", "data.metrics.PRR.value as prr", "source_url as url"]}
    derive:
      strong_signal: {from: prr_rows, field: prr, op: ">=", value: 5, mode: any}
    compute:
      # The server grades: PRR >= 5 is strong. The graded table keeps every row.
      graded_rows: {op: flag, rows: prr_rows, field: prr, threshold: 5}
      strong_aes: {op: pluck, rows: graded_rows, field: term, where: flagged}
    produces: [prr_rows, graded_rows, strong_signal, strong_aes]
    notes: >-
      Grade each row from its PRR: >= 5 strong (the `flagged` rows), >= 2 moderate,
      > 1 weak, else none. Cite every PRR from its row's `url`.

  - id: stratify
    label: "Phase 2b — stratify the strong signals"
    requires: [disproportionality]
    when: strong_signal
    for_each: strong_aes
    as: adverse_event
    calls:
      - tool: FAERS_stratify_by_demographics
        arguments:
          drug_name: "{drug_name}"
          adverse_event: "{adverse_event}"
          stratify_by: "sex"
    notes: Only for reactions graded strong. Skip entirely when none are.

  - id: label_safety
    label: "Phase 3 — FDA label safety sections"
    requires: [resolve_drug]
    calls:
      - tool: FDA_get_boxed_warning_info_by_drug_name
        arguments: {drug_name: "{drug_name}"}
      - tool: FDA_get_warnings_by_drug_name
        arguments: {drug_name: "{drug_name}"}
      - tool: FDA_get_adverse_reactions_by_drug_name
        arguments: {drug_name: "{drug_name}"}
      - tool: FDA_get_contraindications_by_drug_name
        arguments: {drug_name: "{drug_name}"}
    notes: >-
      `{"error": {"code": "NOT_FOUND"}}` is a normal answer here — record
      "Not present in label" and carry on.

  - id: regulatory_context
    label: "Phase 4 — regulatory warnings and toxicity context"
    requires: [resolve_drug]
    calls:
      - tool: OpenTargets_get_drug_warnings_by_chemblId
        arguments: {chemblId: "{chembl_id}"}
      - tool: FDA_get_pharmacokinetics_by_drug_name
        arguments: {drug_name: "{drug_name}"}
    notes: >-
      hERG, AMES and ClinTox have no served tool — write "no tool available",
      never estimate.

  - id: drug_class
    label: "Phase 5a — the drug's own class, from RxClass"
    requires: [disproportionality]
    when: strong_signal
    calls:
      - tool: RxClass_get_drug_classes
        arguments: {drug_name: "{drug_name}", rela_source: "ATC"}
    # The first ATC class is the one the comparison is drawn from.
    extract:
      class_id: "data.0.classId"
      class_name: "data.0.className"
    produces: [class_id, class_name]
    notes: >-
      Only when a signal is strong. A drug RxClass does not classify has no class to
      compare within: the report says so, and the comparative step is skipped.

  - id: class_members
    label: "Phase 5b — the members of that class, from RxClass"
    requires: [drug_class]
    when: class_id
    calls:
      - tool: RxClass_get_class_members
        arguments: {class_id: "{class_id}", rela_source: "ATC"}
    extract:
      class_members: "data[].name"
    produces: [class_members]
    notes: The ingredients RxClass files under the class; the comparator is chosen from them.

  - id: comparator_choice
    label: "Phase 5c — a class member to compare against, chosen by the agent"
    requires: [class_members]
    when: class_members
    calls: []
    # A check reads facts already held, so the members arrive one step earlier.
    judge: [comparator]
    check:
      comparator: [{only_in: class_members}]
    produces: [comparator]
    notes: >-
      Answer `comparator` with ONE name copied exactly from `class_members`, never the
      drug itself: the member most used for the same indication, so FAERS holds enough
      reports on it to compare. Say in the report why it was chosen.

  - id: comparative
    label: "Phase 5 — comparative safety against a class member"
    requires: [comparator_choice]
    when: comparator
    for_each: strong_aes
    as: adverse_event
    calls:
      - tool: FAERS_compare_drugs
        arguments:
          drug1: "{drug_name}"
          drug2: "{comparator}"
          adverse_event: "{adverse_event}"
    notes: >-
      Only when a comparator was chosen from the class. A signal present across the
      class is mechanism-based; one unique to this drug is molecule-specific.

  - id: interactions
    label: "Phase 6 — interactions and pharmacogenomics"
    requires: [resolve_drug]
    calls:
      - tool: FDA_get_drug_interactions_by_drug_name
        arguments: {drug_name: "{drug_name}"}
      - tool: fda_pharmacogenomic_biomarkers
        arguments: {drug_name: "{drug_name}"}

  - id: literature
    label: "Phase 7 — literature evidence"
    requires: [resolve_drug]
    calls:
      - tool: PubMed_search_articles
        arguments: {query: "{drug_name} adverse events safety", limit: 15}
      - tool: EuropePMC_search_articles
        arguments: {query: "{drug_name} pharmacovigilance adverse drug reaction", limit: 10}
    narrowed: >-
      Literature is context for the score, not where the signals come from; the few
      most relevant papers are read, and the source exposes no total to state.
    notes: Real titles with PMIDs or DOIs and years — not trial listings.

  - id: report
    label: "Phase 8 — score the signal and emit the report"
    requires: [disproportionality, label_safety, literature]
    calls: []
    notes: >-
      When the run holds `facts.requested_meddra`, show first how each requested word
      was read: one line per row with the word (`of`), the FAERS term, the `reason`,
      and the placing — "placed under <under> (<ontology>)", "not placed" or "unknown".
      The placing is evidence from an ontology, not a verdict; a term not placed is
      reported with that doubt, never dropped. A requested word with no row was not
      among the source's terms for this drug: say so. Then score from data already
      in hand, out of 100: disproportionality 35, serious AE burden 30, label
      warnings 25, literature 10. Never leave it blank when the data exists. Every
      footnote needs a real https link.
