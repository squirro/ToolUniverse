# One triggering question per served skill, transcribed verbatim from
# Confluence "3.3 SMCP — Tool & skill inventory" (page 4620451858) so the two
# stay diffable. Each question names a concrete entity, because a skill only
# runs to completion when its Phase 1 has something to resolve.
#
# tier 1  = questions where TU measurably beat the web baseline (provisional)
# tier 2  = the remaining skills
# note    = a known open defect, recorded so a failure is not re-diagnosed

skills:
  - skill: adverse-event-detection
    tier: 1
    question: >-
      Lutathera is the closest predicate to our terbium-161 SSTR2 programme.
      What does FAERS actually show for lutetium Lu-177 dotatate —
      disproportionality numbers with the case counts behind them, especially
      myelodysplastic syndrome and renal impairment?
  - skill: toxicology
    tier: 1
    question: >-
      We are reviewing cisplatin as a comparator arm. Which organ toxicities
      does the label carry, and do the FAERS reports actually bear out the
      nephrotoxicity signal with real numbers?
  - skill: small-molecule-discovery
    tier: 1
    question: >-
      We need chemical starting points against KRAS G12D. Which compounds have
      measured potency against it, and how good are those numbers?
  - skill: precision-oncology
    tier: 1
    question: >-
      Stage IV lung adenocarcinoma with an EGFR exon 19 deletion plus a TP53
      co-mutation. Treatment options by evidence tier, and does the TP53
      co-mutation change prognosis?
  - skill: drug-mechanism-research
    tier: 1
    question: >-
      How does lanreotide actually work compared with octreotide — receptor
      subtype selectivity, and does that difference show up anywhere in the
      labels?
  - skill: drug-repurposing
    tier: 1
    question: >-
      Which already-approved drugs could be repurposed against SSTR2-expressing
      neuroendocrine tumours, and how would you rank them on the evidence?

